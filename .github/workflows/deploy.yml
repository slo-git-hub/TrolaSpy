name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEAFSPY_USER: ${{ secrets.LEAFSPY_USER }}
      LEAFSPY_PASS: ${{ secrets.LEAFSPY_PASS }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LEAFSPY_USER LEAFSPY_PASS; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy, missing repo secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Create or find the D1 database
        if: steps.check.outputs.ready == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="trolaspy") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create trolaspy
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="trolaspy") | .uuid')
          fi
          echo "Using D1 database $id"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" ingest/wrangler.toml web/wrangler.toml public/wrangler.toml mcp/wrangler.toml
          sed -i "s/REPLACE_WITH_ACCOUNT_ID/$CLOUDFLARE_ACCOUNT_ID/" web/wrangler.toml
          npx wrangler d1 execute trolaspy --remote --file schema.sql -c ingest/wrangler.toml
          # Columns added after a table was first made (CREATE TABLE IF NOT EXISTS skips them).
          add_column() {
            if ! npx wrangler d1 execute trolaspy --remote --json -c ingest/wrangler.toml --command "PRAGMA table_info($1)" \
                 | jq -e --arg c "$2" '.[0].results[] | select(.name == $c)' > /dev/null; then
              npx wrangler d1 execute trolaspy --remote -c ingest/wrangler.toml --command "ALTER TABLE $1 ADD COLUMN $2 $3"
            fi
          }
          add_column photos duration REAL
          add_column daily max_regen_kw REAL

      - name: Create the photo bucket (R2)
        if: steps.check.outputs.ready == 'true'
        run: |
          if npx wrangler r2 bucket list | grep -q 'trolaspy-photos'; then
            echo "Bucket exists"
          else
            npx wrangler r2 bucket create trolaspy-photos
          fi

      - name: Deploy Workers
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "DEPLOY_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          npm run deploy

      # One-off data fixes, each applied once (recorded in the migrations table): each reads every
      # stored reading, which D1's free plan counts. New readings are checked on arrival
      # (ingest/src/parse.js) and on restore (web/src/admin.js).
      - name: Fix stored data
        if: steps.check.outputs.ready == 'true'
        run: |
          d1() { npx wrangler d1 execute trolaspy --remote -c ingest/wrangler.toml "$@"; }
          applied=$(d1 --json --command "CREATE TABLE IF NOT EXISTS migrations (name TEXT PRIMARY KEY, applied_ts INTEGER);
            SELECT name FROM migrations" | jq -r '.[-1].results[]?.name' || true)
          once() {
            if grep -qx "$1" <<< "$applied"; then echo "$1: done before"; return; fi
            d1 --command "$2; INSERT OR IGNORE INTO migrations VALUES ('$1', $DEPLOY_START_MS);"
          }
          once speed_kmh "UPDATE readings SET speed = ROUND(speed * 3.6, 1) WHERE ts < $DEPLOY_START_MS AND speed IS NOT NULL"
          once clean_values "UPDATE readings SET odo = NULL WHERE odo = 0;
            UPDATE readings SET amb_temp = NULL WHERE amb_temp > 60 OR amb_temp < -45;
            UPDATE readings SET bat_temp = NULL WHERE bat_temp > 80 OR bat_temp < -40;
            UPDATE readings SET bat_amps = NULL WHERE ABS(bat_amps) > 500;
            UPDATE readings SET bat_volts = NULL WHERE bat_volts < 150 OR bat_volts > 450;
            DELETE FROM daily WHERE amb_max > 60 OR amb_min < -45 OR used_kwh > 300"

      - name: Set LeafSpy login
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$LEAFSPY_USER" | npx wrangler secret put LEAFSPY_USER -c ingest/wrangler.toml
          printf '%s' "$LEAFSPY_PASS" | npx wrangler secret put LEAFSPY_PASS -c ingest/wrangler.toml

      - name: Set photo admin
        if: steps.check.outputs.ready == 'true' && env.ADMIN_EMAIL != ''
        run: printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAILS -c web/wrangler.toml
