name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEAFSPY_USER: ${{ secrets.LEAFSPY_USER }}
      LEAFSPY_PASS: ${{ secrets.LEAFSPY_PASS }}
    steps:
      - name: Check secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LEAFSPY_USER LEAFSPY_PASS; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy, missing repo secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Create or find the D1 database
        if: steps.check.outputs.ready == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="trolaspy") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create trolaspy
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="trolaspy") | .uuid')
          fi
          echo "Using D1 database $id"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" ingest/wrangler.toml web/wrangler.toml
          npx wrangler d1 execute trolaspy --remote --file schema.sql -c ingest/wrangler.toml

      - name: Deploy Workers
        if: steps.check.outputs.ready == 'true'
        run: npm run deploy

      - name: Set LeafSpy login
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$LEAFSPY_USER" | npx wrangler secret put LEAFSPY_USER -c ingest/wrangler.toml
          printf '%s' "$LEAFSPY_PASS" | npx wrangler secret put LEAFSPY_PASS -c ingest/wrangler.toml
