name: Cloudflare usage

# Manual only. Shows today's and yesterday's use of the free plan's daily limits (UTC days) and
# the queries that read the most rows, as notes on the run. Needs a token that may read account
# analytics. Queries are shown with their ? placeholders, so no values (or positions) appear.
on:
  workflow_dispatch:

jobs:
  usage:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query
        run: |
          gql() {
            jq -n --arg q "$1" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg from "$(date -u -d yesterday +%F)" --arg to "$(date -u +%F)" \
               --arg since "$(date -u -d '24 hours ago' +%FT%H:00:00Z)" '{query: $q, variables: {a: $a, from: $from, to: $to, since: $since}}' \
            | curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d @-
          }
          note() { echo "::notice title=$1::$(echo "$2" | jq -c "$3" | head -c 3000)"; }
          r=$(gql 'query ($a: string!, $from: Date!, $to: Date!) { viewer { accounts(filter: {accountTag: $a}) {
                d1AnalyticsAdaptiveGroups(limit: 100, filter: {date_geq: $from, date_leq: $to}, orderBy: [date_ASC]) {
                  sum { readQueries writeQueries rowsRead rowsWritten } dimensions { date } } } } }')
          note "D1 per day" "$r" '.errors // .data.viewer.accounts[0].d1AnalyticsAdaptiveGroups'
          r=$(gql 'query ($a: string!, $from: Date!, $to: Date!) { viewer { accounts(filter: {accountTag: $a}) {
                workersInvocationsAdaptive(limit: 100, filter: {date_geq: $from, date_leq: $to}) {
                  sum { requests errors subrequests } dimensions { date scriptName } } } } }')
          note "Workers per day" "$r" '.errors // .data.viewer.accounts[0].workersInvocationsAdaptive'
          r=$(gql 'query ($a: string!, $since: Time!) { viewer { accounts(filter: {accountTag: $a}) {
                d1AnalyticsAdaptiveGroups(limit: 100, filter: {datetimeHour_geq: $since}, orderBy: [datetimeHour_ASC]) {
                  sum { rowsRead rowsWritten } dimensions { datetimeHour } } } } }')
          note "D1 per hour, last 24 h" "$r" '.errors // (.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups | map([.dimensions.datetimeHour[11:13], .sum.rowsRead, .sum.rowsWritten]))'
          r=$(gql 'query ($a: string!, $from: Date!, $to: Date!) { viewer { accounts(filter: {accountTag: $a}) {
                d1QueriesAdaptiveGroups(limit: 12, filter: {date_geq: $from, date_leq: $to}, orderBy: [sum_rowsRead_DESC]) {
                  count sum { rowsRead rowsWritten } dimensions { query } } } } }')
          echo "$r" | jq -c '.errors // .data.viewer.accounts[0].d1QueriesAdaptiveGroups[]' | while read -r q; do
            echo "::notice title=Top query::$(echo "$q" | jq -r '"\(.sum.rowsRead) rows read, \(.count) runs: \(.dimensions.query | gsub("\\s+"; " ") | .[0:220])"' 2>/dev/null || echo "$q" | head -c 600)"
          done
