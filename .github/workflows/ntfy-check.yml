name: Check ntfy from Cloudflare

# Manual only. Deploys a throwaway Worker, asks it to publish to a random ntfy.sh topic
# (the same way the alerts do), prints what ntfy answered, then deletes the Worker.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: From the GitHub runner (for comparison)
        run: |
          curl -sS -m 20 -o /dev/null -w 'health %{http_code}\n' https://ntfy.sh/v1/health
          curl -sS -m 20 https://ntfy.sh/v1/account | jq -c '{limits: .limits | {messages}, stats: .stats | {messages, messages_remaining}}'
      - name: From a Cloudflare Worker
        run: |
          mkdir ntfy-check && cd ntfy-check
          cat > worker.js <<'EOF'
          export default {
            async fetch() {
              const topic = 'trola-diag-' + crypto.randomUUID().slice(0, 12);
              const pick = (h) => Object.fromEntries([...h].filter(([k]) => /rate|retry|server|via|cf-ray/.test(k)));
              const out = {};
              for (const [name, url, init] of [
                ['health', 'https://ntfy.sh/v1/health', {}],
                ['account', 'https://ntfy.sh/v1/account', {}],
                ['publish', `https://ntfy.sh/${topic}`, { method: 'POST', headers: { Title: 'TrolaSpy test', Tags: 'wave', Priority: '3' }, body: 'diagnostic' }],
                ['publish_json', 'https://ntfy.sh/', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ topic, title: 'TrolaSpy test', message: 'diagnostic' }) }],
              ]) {
                try {
                  const r = await fetch(url, init);
                  const text = await r.text();
                  let body = text.slice(0, 300);
                  if (name === 'account') { try { const a = JSON.parse(text); body = { limits: a.limits?.messages, stats: a.stats }; } catch {} }
                  out[name] = { status: r.status, headers: pick(r.headers), body };
                } catch (e) { out[name] = { error: String(e) }; }
              }
              return Response.json(out);
            },
          };
          EOF
          printf 'name = "trolaspy-ntfy-check"\nmain = "worker.js"\ncompatibility_date = "2026-09-01"\nworkers_dev = true\n' > wrangler.toml
          # Deleted through the API: wrangler delete also wants KV access, which the token lacks.
          remove() { curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/trolaspy-ntfy-check?force=true" | jq -c '{success, errors}'; }
          trap remove EXIT
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1)
          echo "Worker: $URL"
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -sS -m 60 -f "$URL" -o out.json; then jq . out.json; exit 0; fi
          done
          echo "The throwaway Worker never answered"; exit 1
