name: Diagnose readings

# Manual only. Prints aggregate numbers (no positions) to check units from LeafSpy.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Query
        run: |
          q() { echo "== $1"; npx wrangler d1 execute trolaspy --remote --json --command "$2" | jq -c '.[0].results[]'; }
          SINCE="(strftime('%s','now') - 3*86400) * 1000"
          q "Implausible pack readings (all time, no positions)" \
            "SELECT date(ts/1000,'unixepoch') day, strftime('%H:%M:%S', ts/1000, 'unixepoch') t, bat_volts v, bat_amps a, ROUND(bat_volts*bat_amps) w, soc, gids, speed, odo, pwr_sw, chrg_mode cm, plug_state plug, chrg_pwr, seq, amb_temp, bat_temp, soh, rpm
             FROM readings WHERE ABS(bat_volts*bat_amps) > 120000 OR bat_volts > 420 OR (bat_volts < 200 AND bat_volts IS NOT NULL) OR ABS(bat_amps) > 450 ORDER BY ts LIMIT 60"
          q "Count of implausible rows by kind" \
            "SELECT SUM(ABS(bat_volts*bat_amps) > 120000) huge_w, SUM(bat_volts > 420) v_high, SUM(bat_volts < 200) v_low, SUM(bat_volts = 0) v_zero, SUM(ABS(bat_amps) > 450) a_huge, COUNT(*) total, MIN(date(ts/1000,'unixepoch')) first_day FROM readings"
          q "Neighbours of the worst row (no positions)" \
            "WITH bad AS (SELECT ts FROM readings ORDER BY ABS(bat_volts*bat_amps) DESC LIMIT 1)
             SELECT ts - (SELECT ts FROM bad) rel_ms, bat_volts v, bat_amps a, soc, gids, speed, odo, pwr_sw, chrg_mode cm, seq, rpm FROM readings
             WHERE ts BETWEEN (SELECT ts FROM bad) - 60000 AND (SELECT ts FROM bad) + 60000 ORDER BY ts"
          q "Charging sessions stored" \
            "SELECT date(start_ts/1000,'unixepoch') day, ROUND((end_ts-start_ts)/60000.0) min, ROUND(kwh,2) kwh, ROUND(max_kw,1) max_kw, soc_start, soc_end, mode FROM charges ORDER BY start_ts DESC LIMIT 10"
