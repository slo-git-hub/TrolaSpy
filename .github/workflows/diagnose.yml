name: Diagnose readings

# Manual only. Prints aggregate numbers (no positions) to check units from LeafSpy.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Query
        run: |
          q() { echo "== $1"; npx wrangler d1 execute trolaspy --remote --json --command "$2" | jq -c '.[0].results[]'; }
          SINCE="(strftime('%s','now') - 3*86400) * 1000"
          q "Implausible pack readings left" \
            "SELECT SUM(ABS(bat_volts*bat_amps) > 120000) huge_w, SUM(ABS(bat_amps) > 500) a_huge, SUM(bat_volts < 150) v_low, COUNT(*) total FROM readings"
          q "New columns and tables" \
            "SELECT (SELECT COUNT(*) FROM pragma_table_info('daily') WHERE name = 'max_regen_kw') daily_col, (SELECT COUNT(*) FROM sqlite_master WHERE name = 'victron_days') victron_days_table"
          q "Energy per UTC day (live formula)" \
            "WITH r AS (SELECT ts, odo, speed, pwr_sw, COALESCE(chrg_mode,0) cm, bat_volts*bat_amps w, ts - LAG(ts) OVER (ORDER BY ts) dt FROM readings WHERE ts >= (strftime('%s','now') - 4*86400) * 1000)
             SELECT date(ts/1000,'unixepoch') day, COUNT(*) n, MAX(odo)-MIN(odo) km,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 THEN w*dt END)/3.6e9,2) used,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w<0 AND cm=0 AND pwr_sw=1 THEN -w*dt END)/3.6e9,2) regen
             FROM r GROUP BY day ORDER BY day DESC"
          q "Stored day summaries" \
            "SELECT day, readings, distance_km km, ROUND(used_kwh,2) used, ROUND(regen_kwh,2) regen, ROUND(charged_kwh,2) charged, charges, max_regen_kw FROM daily ORDER BY day DESC LIMIT 5"
          q "Readings per hour since yesterday 15:00 UTC (outage check)" \
            "SELECT strftime('%m-%d %H', ts/1000, 'unixepoch') hour, COUNT(*) n FROM readings WHERE ts >= (strftime('%s','2026-10-13 15:00:00')) * 1000 GROUP BY hour ORDER BY hour"
          q "Charging sessions: stored and where the archive is" \
            "SELECT (SELECT COUNT(*) FROM charges) stored, (SELECT ROUND((strftime('%s','now')*1000 - CAST(value AS INTEGER)) / 3600000.0, 1) FROM settings WHERE key = 'charges_through') through_h_ago"
          q "Dashboard readings" \
            "SELECT value FROM settings WHERE key = 'soc_cal'"
          echo "== D1 query insights, last 24 h (top by rows read)"
          npx wrangler d1 insights trolaspy --timePeriod=1d --sort-by=reads --limit=8 --json | jq -c '.[] | {reads: .totalRowsRead, runs: .numberOfTimesRun, q: (.query[0:90])}' || true
