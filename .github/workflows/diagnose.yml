name: Diagnose readings

# Manual only. Prints aggregate numbers (no positions) to check units from LeafSpy.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Query
        run: |
          q() { echo "== $1"; npx wrangler d1 execute trolaspy --remote --json --command "$2" | jq -c '.[0].results[]'; }
          SINCE="(strftime('%s','now') - 3*86400) * 1000"
          D14="(strftime('%s','now') - 14*86400) * 1000"
          q "Energy per UTC day, live formula (kWh)" \
            "WITH r AS (SELECT ts, odo, speed, pwr_sw, COALESCE(chrg_mode,0) cm, plug_state, gids, soc, bat_volts*bat_amps w, ts - LAG(ts) OVER (ORDER BY ts) dt FROM readings WHERE ts >= $D14)
             SELECT date(ts/1000,'unixepoch') day, COUNT(*) n, MAX(odo)-MIN(odo) km,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 THEN w*dt END)/3.6e9,2) used,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w<0 AND cm=0 AND pwr_sw=1 THEN -w*dt END)/3.6e9,2) regen,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 AND speed>1 THEN w*dt END)/3.6e9,2) used_moving,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 AND COALESCE(pwr_sw,0)=0 THEN w*dt END)/3.6e9,2) used_car_off,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 AND plug_state>0 THEN w*dt END)/3.6e9,2) used_plugged,
                    ROUND(SUM(CASE WHEN dt<=150000 AND w>0 AND cm=0 AND COALESCE(speed,0)<=1 AND pwr_sw=1 THEN w*dt END)/3.6e9,2) used_standing_on,
                    ROUND(AVG(CASE WHEN dt<=150000 THEN dt END)/1000.0,1) avg_dt_s, ROUND(MAX(w)) max_w, MIN(gids) gmin, MAX(gids) gmax
             FROM r GROUP BY day ORDER BY day DESC"
          q "Stored daily summaries" \
            "SELECT day, readings, distance_km, ROUND(used_kwh,2) used, ROUND(regen_kwh,2) regen, ROUND(charged_kwh,2) charged, computed_ts FROM daily ORDER BY day DESC LIMIT 14"
          q "Driving rows, last 14 days: volts and amps" \
            "SELECT COUNT(*) n, ROUND(MIN(bat_volts),1) v_min, ROUND(AVG(bat_volts),1) v_avg, ROUND(MAX(bat_volts),1) v_max,
                    ROUND(MIN(bat_amps),1) a_min, ROUND(AVG(bat_amps),1) a_avg, ROUND(MAX(bat_amps),1) a_max, SUM(bat_amps > 400) a_over_400
             FROM readings WHERE ts >= $D14 AND speed > 1"
          q "Gap between readings while driving (seconds)" \
            "WITH r AS (SELECT speed, ts - LAG(ts) OVER (ORDER BY ts) dt FROM readings WHERE ts >= $D14)
             SELECT CASE WHEN dt < 5000 THEN '<5' WHEN dt < 15000 THEN '5-15' WHEN dt < 40000 THEN '15-40' WHEN dt < 150000 THEN '40-150' ELSE '>150' END gap, COUNT(*) n
             FROM r WHERE speed > 1 GROUP BY gap"
          q "Same-second duplicates (two rows within 1 s)" \
            "WITH r AS (SELECT ts - LAG(ts) OVER (ORDER BY ts) dt, seq, LAG(seq) OVER (ORDER BY ts) pseq FROM readings WHERE ts >= $D14)
             SELECT COUNT(*) n, SUM(seq = pseq) same_seq FROM r WHERE dt < 1000"
          q "Latest drives: rows (minutes ago, no positions)" \
            "SELECT ROUND((strftime('%s','now')*1000 - ts)/60000.0) min_ago, ROUND((ts - LAG(ts) OVER (ORDER BY ts))/1000.0) gap_s, speed, pwr_sw, chrg_mode cm, plug_state plug,
                    bat_volts v, bat_amps a, ROUND(bat_volts*bat_amps) w, soc, gids, odo, seq
             FROM readings WHERE ts >= (strftime('%s','now') - 2*86400) * 1000 AND (speed > 1 OR pwr_sw = 1) ORDER BY ts DESC LIMIT 80"
          q "SoC vs gids (per 5% of LeafSpy SoC, last 120 days)" \
            "SELECT CAST(soc/5 AS INTEGER)*5 soc5, COUNT(*) n, ROUND(AVG(soc),1) soc, ROUND(AVG(gids)) gids, MIN(gids) gmin, MAX(gids) gmax, ROUND(AVG(soh),1) soh, ROUND(AVG(hx),1) hx, ROUND(AVG(ahr),1) ahr
             FROM readings WHERE ts >= (strftime('%s','now') - 120*86400) * 1000 AND soc > 0 AND gids > 0 GROUP BY soc5 ORDER BY soc5"
          q "Highest and lowest SoC seen" \
            "SELECT MIN(soc) soc_min, MAX(soc) soc_max, MIN(gids) gids_min, MAX(gids) gids_max FROM readings WHERE soc > 0"
          q "Last 10 readings: SoC and gids" \
            "SELECT ROUND((strftime('%s','now')*1000 - ts)/60000.0) min_ago, soc, gids, pwr_sw, chrg_mode, bat_volts FROM readings ORDER BY ts DESC LIMIT 10"
