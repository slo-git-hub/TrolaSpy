name: Diagnose readings

# Manual only. Prints aggregate numbers (no positions) to check units from LeafSpy.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Query
        run: |
          q() { echo "== $1"; npx wrangler d1 execute trolaspy --remote --json --command "$2" | jq -c '.[0].results[]'; }
          SINCE="(strftime('%s','now') - 3*86400) * 1000"
          q "RPM and tablet battery, last 3 days" \
            "SELECT COUNT(*) n, SUM(rpm IS NULL) rpm_null, SUM(rpm = 0) rpm_0, SUM(rpm < 0) rpm_neg, MIN(rpm) rpm_min, MAX(rpm) rpm_max, SUM(rpm > 12000) rpm_huge, SUM(dev_bat IS NULL) tab_null, SUM(dev_bat = 0) tab_0, MIN(dev_bat) tab_min, MAX(dev_bat) tab_max FROM readings WHERE ts >= $SINCE"
          q "RPM by car on/off and charging" \
            "SELECT pwr_sw, COALESCE(chrg_mode,0) cm, COUNT(*) n, MIN(rpm) mn, MAX(rpm) mx, ROUND(AVG(rpm)) av FROM readings WHERE ts >= $SINCE GROUP BY 1, 2"
          q "RPM by speed (km/h, rounded to 10)" \
            "SELECT CAST(ROUND(speed/10)*10 AS INT) sp, COUNT(*) n, MIN(rpm) mn, ROUND(AVG(rpm)) av, MAX(rpm) mx FROM readings WHERE ts >= $SINCE AND pwr_sw = 1 GROUP BY sp ORDER BY sp"
          q "Most common RPM values" \
            "SELECT rpm, COUNT(*) n FROM readings WHERE ts >= $SINCE GROUP BY rpm ORDER BY n DESC LIMIT 8"
          echo "== D1 query insights, last 24 h (top by rows read)"
          npx wrangler d1 insights trolaspy --timePeriod=1d --sort-by=reads --limit=8 --json | jq -c '.[] | {reads: .totalRowsRead, runs: .numberOfTimesRun, q: (.query[0:90])}' || true
