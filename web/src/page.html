<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#175064">
<title>TROLA · live</title>
<link rel="icon" href="/logo">
<link rel="apple-touch-icon" href="/logo">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #e8f1f1; --card: rgba(255,255,255,.93); --solid: #ffffff; --text: #123a49;
    --muted: #557280; --faint: #93aab3; --line: #d6e4e6; --navy: #175064;
    --accent: #04a4d8; --accent-ink: #0a6f96; --accent-soft: #d5eef8;
    --batt: #6f9e2f; --charge: #c27c0e; --charge-soft: #fbedc9; --off: #e3ecee;
    --shadow: 0 8px 30px rgba(23,80,100,.14);
    --s-bat: #c27c0e; --s-amb: #0a8fc4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1a20; --card: rgba(17,36,44,.93); --solid: #132932; --text: #e3f0f3;
      --muted: #9db6bf; --faint: #66808a; --line: #23404b; --navy: #cfe7ee;
      --accent: #2fc0f0; --accent-ink: #5fd0f5; --accent-soft: #10394a;
      --batt: #a4ce50; --charge: #f5c04a; --charge-soft: #3b2e0e; --off: #1b3540;
      --shadow: 0 8px 30px rgba(0,0,0,.45);
      --s-bat: #c2841c; --s-amb: #1a9ccc; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  #map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }

  .panel { position: absolute; z-index: 500; top: 16px; left: 16px; bottom: 16px; width: 380px;
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scrollbar-width: none;
    padding-bottom: env(safe-area-inset-bottom); }
  .panel::-webkit-scrollbar { display: none; }
  .card { background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }

  header.card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  header img.mark { width: 44px; height: 44px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line); }
  .word { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: .32em; color: var(--navy); line-height: 1; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: .04em; }
  .banner { position: relative; padding: 0; overflow: hidden; aspect-ratio: 2 / 1; }
  .banner img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .banner .live { position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,.85); }
  .banner .live.on { background: rgba(255,255,255,.9); }
  .panel > * { flex: none; }
  header.card.compact { display: none; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: var(--off); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live.on i { background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
  .live.on { color: var(--accent-ink); background: var(--accent-soft); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    100% { box-shadow: 0 0 0 9px transparent; } }

  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--off); }
  .ring .val { stroke: var(--batt); stroke-linecap: round; transition: stroke-dashoffset .6s ease, stroke .3s; }
  .ring.charging .val { stroke: var(--charge); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring b { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .ring small { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    font-size: 13px; background: var(--off); color: var(--muted); }
  .chip svg { width: 14px; height: 14px; }
  .chip.drive { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.charge { background: var(--charge-soft); color: var(--charge); }
  .updated { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--solid); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .tile span { display: block; color: var(--muted); font-size: 12px; }
  .tile b { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .tile b small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chart-head h2 { font-size: 14px; margin: 0; }
  .seg { display: flex; background: var(--off); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 4px 10px; border-radius: 8px; cursor: pointer; }
  .seg button.active { background: var(--solid); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
  .stat span { display: block; color: var(--muted); font-size: 11px; }
  .stat b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat b small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .regen { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .regen .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--off); margin: 4px 0; gap: 2px; }
  .regen .bar i { display: block; height: 100%; }
  .regen .used { background: var(--s-bat); }
  .regen .back { background: var(--batt); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); min-height: 16px; margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .chart .zero { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart { position: relative; height: 130px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { fill: var(--faint); font-size: 10px; }
  .chart .area { opacity: .18; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .chart .cross { stroke: var(--faint); stroke-width: 1; }
  .chart .dot { stroke: var(--solid); stroke-width: 2; }
  .tip { position: absolute; top: -6px; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    background: var(--solid); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 12px;
    box-shadow: var(--shadow); display: none; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }

  .foot { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); padding: 0 4px; }
  .foot a { color: var(--accent-ink); text-decoration: none; font-weight: 600; }

  .fab { position: absolute; z-index: 500; right: 16px; bottom: 24px; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--text); box-shadow: var(--shadow);
    display: grid; place-items: center; cursor: pointer; }
  .fab svg { width: 20px; height: 20px; }

  .van { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; overflow: hidden;
    box-shadow: 0 0 0 3px var(--accent), 0 6px 16px rgba(0,0,0,.35); background: #fff; }
  .van img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .van.stale { box-shadow: 0 0 0 3px var(--faint), 0 6px 16px rgba(0,0,0,.35); filter: grayscale(.6); }
  .tiles { filter: saturate(.7) brightness(1.03); }
  @media (prefers-color-scheme: dark) {
    .tiles { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.45); }
  }
  .leaflet-control-attribution { font-size: 10px; background: var(--card) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }
  .leaflet-control-zoom { display: none; }

  /* Phones: map on top, cards scroll underneath like a sheet. */
  @media (max-width: 760px) {
    #map { position: relative; height: 52dvh; inset: auto; }
    .panel { position: static; width: auto; margin-top: -32px; padding: 0 12px calc(16px + env(safe-area-inset-bottom));
      overflow: visible; }
    .panel > * { position: relative; z-index: 500; }
    .banner { display: none; }
    header.card.compact { display: flex; }
    .panel > header.card { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; }
    .fab { top: calc(52dvh - 92px); bottom: auto; right: 14px; }
    .ring { width: 100px; height: 100px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .leaflet-bottom { bottom: 32px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<button class="fab" id="recenter" aria-label="Center on Trola">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
</button>

<div class="panel">
  <div class="card banner">
    <img src="/banner.jpg" alt="TROLA, an electric van on a mountain road">
    <div class="live" data-live><i></i><span>Offline</span></div>
  </div>
  <header class="card compact">
    <img class="mark" src="/logo" alt="">
    <div><h1 class="word">TROLA</h1><div class="sub">on the road</div></div>
    <div class="live" data-live><i></i><span>Offline</span></div>
  </header>

  <section class="card">
    <div class="hero">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle class="val" id="ringval" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
        <div class="num"><b id="soc">–</b><small id="gids"></small></div>
      </div>
      <div>
        <div class="chips" id="chips"></div>
        <div class="updated" id="updated">Loading…</div>
      </div>
    </div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="chart-head">
      <h2 id="rangeTitle">Last 24 hours</h2>
      <div class="seg" id="range">
        <button data-h="24" class="active">24h</button>
        <button data-h="168">7d</button>
        <button data-h="720">30d</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="regen" id="regenbar"></div>
  </section>

  <section class="card">
    <div class="chart-head">
      <div class="seg" id="metric">
        <button data-m="soc" class="active">Battery</button>
        <button data-m="speed">Speed</button>
        <button data-m="kw">Power</button>
        <button data-m="temp">Temp</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"></div>
  </section>

  <div class="foot"><a href="https://www.instagram.com/trolaontheroad/" target="_blank" rel="noopener">@trolaontheroad</a><span id="coords"></span><a id="gmaps" target="_blank" rel="noopener" hidden>Open in Maps ↗</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const STALE_MS = 5 * 60 * 1000;
// Keep the route clear of the side panel on wide screens.
const fitOpts = () => (innerWidth > 760 ? { paddingTopLeft: [420, 40], paddingBottomRight: [40, 40] } : { padding: [40, 40] });

const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([46.05, 14.5], 8);
// OpenStreetMap's own tiles: free, no API key; restyled with CSS to match the page.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, className: 'tiles',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const trackLine = L.polyline([], { color: css('--accent'), weight: 5, opacity: 0.85, lineCap: 'round' }).addTo(map);
const vanIcon = (stale) => L.divIcon({ className: '', iconSize: [44, 44], iconAnchor: [22, 22],
  html: `<div class="van ${stale ? 'stale' : ''}"><img src="/logo" alt=""></div>` });
const marker = L.marker([0, 0], { icon: vanIcon(false) });
let hours = 24, firstFit = true, lastPos = null, trackPoints = [];

const ICON = {
  drive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  park: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
};
const CHARGE = { 1: 'Charging', 2: 'Charging', 3: 'Fast charging' };
const n = (v, d = 0) => (v === null || v === undefined ? '–' : Number(v).toFixed(d));

function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s} s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

function renderLatest({ reading: r, lastPosition }) {
  if (!r) { $('updated').textContent = 'No data yet. Waiting for LeafSpy.'; return; }
  const stale = Date.now() - r.ts > STALE_MS;
  const charging = !!CHARGE[r.chrg_mode];
  document.querySelectorAll('[data-live]').forEach((el) => {
    el.classList.toggle('on', !stale);
    el.querySelector('span').textContent = stale ? 'Offline' : 'Live';
  });
  $('updated').textContent = `Updated ${ago(r.ts)}`;

  const soc = Math.max(0, Math.min(100, r.soc || 0));
  $('soc').textContent = r.soc === null ? '–' : `${Math.round(r.soc)}%`;
  $('gids').textContent = r.gids !== null ? `${r.gids} Gids` : '';
  $('ringval').style.strokeDashoffset = 314.16 * (1 - soc / 100);
  $('ring').classList.toggle('charging', charging);

  const chips = [];
  if (charging && stale) chips.push(`<span class="chip">${ICON.bolt}Was charging</span>`);
  else if (charging) chips.push(`<span class="chip charge">${ICON.bolt}${CHARGE[r.chrg_mode]}${r.chrg_pwr ? ` · ${n(r.chrg_pwr / 1000, 1)} kW` : ''}</span>`);
  else if (r.pwr_sw === 1 && !stale) chips.push(`<span class="chip drive">${ICON.drive}${r.speed > 1 ? `Driving · ${n(r.speed)} km/h` : 'Ready'}</span>`);
  else chips.push(`<span class="chip">${ICON.park}Parked</span>`);
  if (r.plug_state === 2 && !charging) chips.push(`<span class="chip">${ICON.plug}Plugged in</span>`);
  $('chips').innerHTML = chips.join('');

  const kw = r.bat_volts !== null && r.bat_amps !== null ? (r.bat_volts * r.bat_amps) / 1000 : null;
  const powerLabel = kw === null ? 'Power' : charging ? 'Charging in' : kw < -0.2 ? 'Regen' : 'Power';
  const tiles = [
    ['Speed', n(r.speed), 'km/h'],
    [powerLabel, kw === null ? '–' : n(Math.abs(kw), 1), 'kW'],
    ['Battery health', n(r.soh, 1), '%'],
    ['Battery temp', n(r.bat_temp, 1), '°C'],
    ['Outside', n(r.amb_temp, 1), '°C'],
    ['Odometer', r.odo === null ? '–' : Number(r.odo).toLocaleString(), 'km'],
    ['Pack', `${n(r.bat_volts)}`, `V · ${n(r.bat_amps, 1)} A`],
    ['Elevation', n(r.elv), 'm'],
  ];
  $('tiles').innerHTML = tiles.map(([k, v, u]) => `<div class="tile"><span>${k}</span><b>${v}<small>${u}</small></b></div>`).join('');

  const pos = r.lat !== null ? r : lastPosition;
  if (pos && pos.lat !== null) {
    lastPos = [pos.lat, pos.lon];
    marker.setLatLng(lastPos).setIcon(vanIcon(stale)).addTo(map);
    $('coords').textContent = `${pos.lat.toFixed(5)}, ${pos.lon.toFixed(5)}`;
    $('gmaps').href = `https://www.google.com/maps?q=${pos.lat},${pos.lon}`;
    $('gmaps').hidden = false;
    if (firstFit) { map.setView(lastPos, 14); firstFit = false; }
  }
}

const METRICS = {
  soc: { label: 'Battery', unit: '%', series: [{ key: 'soc', color: '--batt' }], domain: () => [0, 100], ticks: [0, 50, 100], area: true },
  speed: { label: 'Speed', unit: ' km/h', series: [{ key: 'speed', color: '--accent' }], domain: (lo, hi) => [0, Math.max(60, Math.ceil(hi / 20) * 20)] },
  kw: { label: 'Power', unit: ' kW', series: [{ key: 'kw', color: '--accent' }], zero: true,
    domain: (lo, hi) => [Math.min(-10, Math.floor(lo / 10) * 10), Math.max(10, Math.ceil(hi / 10) * 10)],
    note: 'Above 0: drawing power · below 0: regen or charging' },
  temp: { label: 'Temp', unit: '°C', series: [{ key: 'bat_temp', color: '--s-bat', name: 'Battery' }, { key: 'amb_temp', color: '--s-amb', name: 'Outside' }],
    domain: (lo, hi) => [Math.floor(Math.min(0, lo) / 10) * 10, Math.max(30, Math.ceil(hi / 10) * 10)] },
};
let metric = 'soc';

function renderChart(points) {
  trackPoints = points;
  const el = $('chart'), m = METRICS[metric];
  const pts = points.filter((p) => m.series.some((s) => p[s.key] !== null && p[s.key] !== undefined));
  $('legend').innerHTML = m.series.length > 1
    ? m.series.map((s) => `<span><i style="background:var(${s.color})"></i>${s.name}</span>`).join('')
    : (m.note ? `<span>${m.note}</span>` : '');
  if (pts.length < 2) { el.innerHTML = `<div class="empty">No ${m.label.toLowerCase()} data in this range yet.</div>`; return; }

  const vals = pts.flatMap((p) => m.series.map((s) => p[s.key]).filter((v) => v !== null && v !== undefined));
  const [lo, hi] = m.domain(Math.min(...vals), Math.max(...vals));
  const ticks = m.ticks || [lo, m.zero ? 0 : Math.round((lo + hi) / 2), hi];
  const W = el.clientWidth, H = el.clientHeight, L0 = 34, B = 16, T = 6;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const x = (t) => L0 + ((t - t0) / Math.max(1, t1 - t0)) * (W - L0 - 4);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const base = y(Math.max(lo, 0));

  // One path per series, broken across gaps over 15 min (van off).
  const paths = m.series.map((s) => {
    let d = '', area = '', seg = [];
    const flush = () => {
      if (!seg.length) return;
      const line = seg.map((p, i) => `${i ? 'L' : 'M'}${x(p.ts).toFixed(1)},${y(p[s.key]).toFixed(1)}`).join('');
      d += line;
      area += `M${x(seg[0].ts).toFixed(1)},${base}` + line.replace(/M/g, 'L') + `L${x(seg[seg.length - 1].ts).toFixed(1)},${base}Z`;
      seg = [];
    };
    pts.forEach((p, i) => {
      if (p[s.key] === null || p[s.key] === undefined) { flush(); return; }
      if (i && p.ts - pts[i - 1].ts > 15 * 60 * 1000) flush();
      seg.push(p);
    });
    flush();
    return `${m.area ? `<path class="area" fill="var(${s.color})" d="${area}"/>` : ''}<path class="line" stroke="var(${s.color})" d="${d}"/>`;
  }).join('');

  const fmtT = (t) => new Date(t).toLocaleString([], hours > 24 ? { day: 'numeric', month: 'short' } : { hour: '2-digit', minute: '2-digit' });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
    ${ticks.map((v) => `<line class="${m.zero && v === 0 ? 'zero' : 'grid'}" x1="${L0}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="0" y="${y(v) + 3}">${v}${m.unit.trim() === '%' ? '%' : ''}</text>`).join('')}
    ${paths}
    <text class="axis" x="${L0}" y="${H - 2}">${fmtT(t0)}</text>
    <text class="axis" x="${W}" y="${H - 2}" text-anchor="end">${fmtT(t1)}</text>
    <line class="cross" id="cross" y1="${T}" y2="${H - B}" visibility="hidden"/>
    ${m.series.map((s, i) => `<circle class="dot" id="cdot${i}" r="4" fill="var(${s.color})" visibility="hidden"/>`).join('')}
    <rect id="hit" x="${L0}" y="0" width="${W - L0}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="tip"></div>`;

  const hit = $('hit'), tip = $('tip'), cross = $('cross');
  const show = (clientX) => {
    const rect = el.getBoundingClientRect();
    const t = t0 + ((clientX - rect.left - L0) / (W - L0 - 4)) * (t1 - t0);
    let best = pts[0];
    for (const p of pts) if (Math.abs(p.ts - t) < Math.abs(best.ts - t)) best = p;
    const px = x(best.ts);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    const parts = [];
    m.series.forEach((s, i) => {
      const dot = $(`cdot${i}`), v = best[s.key];
      if (v === null || v === undefined) { dot.setAttribute('visibility', 'hidden'); return; }
      dot.setAttribute('cx', px); dot.setAttribute('cy', y(v)); dot.setAttribute('visibility', 'visible');
      parts.push(`${s.name ? `${s.name} ` : ''}${Number(v).toFixed(metric === 'soc' || metric === 'speed' ? 0 : 1)}${m.unit}`);
    });
    tip.style.display = 'block';
    tip.textContent = `${parts.join(' · ')} · ${new Date(best.ts).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;
    const half = tip.offsetWidth / 2;
    tip.style.left = `${Math.min(Math.max(px, half), W - half)}px`;
  };
  const hide = () => {
    tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden');
    m.series.forEach((s, i) => $(`cdot${i}`).setAttribute('visibility', 'hidden'));
  };
  hit.addEventListener('pointermove', (e) => show(e.clientX));
  hit.addEventListener('pointerdown', (e) => show(e.clientX));
  hit.addEventListener('pointerleave', hide);
}

function renderStats(st) {
  $('rangeTitle').textContent = { 24: 'Last 24 hours', 168: 'Last 7 days', 720: 'Last 30 days' }[hours];
  const used = st.used_kwh || 0, regen = st.regen_kwh || 0, km = st.distance_km || 0;
  const net = used - regen, driveH = (st.drive_s || 0) / 3600;
  const dur = driveH >= 1 ? `${Math.floor(driveH)}h ${Math.round((driveH % 1) * 60)}` : `${Math.round(driveH * 60)}`;
  const items = [
    ['Distance', km ? km.toLocaleString() : '0', 'km'],
    ['Driving', dur, 'min'],
    ['Avg speed', driveH > 0.02 && km ? n(km / driveH) : '–', 'km/h'],
    ['Top speed', n(st.max_speed), 'km/h'],
    ['Energy used', n(used, 1), 'kWh'],
    ['Regen', n(regen, 1), 'kWh'],
    ['Consumption', km >= 1 ? n((net / km) * 100, 1) : '–', 'kWh/100km'],
    ['Charged', n(st.charged_kwh || 0, 1), 'kWh'],
  ];
  $('stats').innerHTML = items.map(([k, v, u]) => `<div class="stat"><span>${k}</span><b>${v}<small>${u}</small></b></div>`).join('');
  $('regenbar').innerHTML = used > 0.05
    ? `<div class="bar"><i class="used" style="flex:${Math.max(net, 0)}"></i><i class="back" style="flex:${regen}"></i></div>
       Regen gave back <b>${Math.round((regen / used) * 100)}%</b> of the energy used${st.max_regen_kw ? ` · strongest regen ${n(st.max_regen_kw)} kW` : ''}`
    : '';
}

function renderTrack({ points }) {
  trackLine.setLatLngs(points.filter((p) => p.lat !== null).map((p) => [p.lat, p.lon]));
  if (firstFit && trackLine.getLatLngs().length > 1) {
    map.fitBounds(trackLine.getBounds(), { ...fitOpts(), maxZoom: 15 });
    firstFit = false;
  }
  renderChart(points);
}

async function refresh() {
  try {
    const [latest, track, st] = await Promise.all([
      fetch('/api/latest').then((r) => r.json()),
      fetch(`/api/track?hours=${hours}`).then((r) => r.json()),
      fetch(`/api/stats?hours=${hours}`).then((r) => r.json()),
    ]);
    renderTrack(track);
    renderStats(st);
    renderLatest(latest);
  } catch (e) {
    $('updated').textContent = 'Could not load data. Retrying…';
  }
}

$('range').addEventListener('click', (e) => {
  const h = e.target.dataset && e.target.dataset.h;
  if (!h) return;
  hours = Number(h);
  document.querySelectorAll('#range button').forEach((b) => b.classList.toggle('active', b === e.target));
  refresh().then(() => { if (trackLine.getLatLngs().length > 1) map.fitBounds(trackLine.getBounds(), fitOpts()); });
});
$('metric').addEventListener('click', (e) => {
  const m = e.target.dataset && e.target.dataset.m;
  if (!m) return;
  metric = m;
  document.querySelectorAll('#metric button').forEach((b) => b.classList.toggle('active', b === e.target));
  renderChart(trackPoints);
});
$('recenter').addEventListener('click', () => { if (lastPos) map.flyTo(lastPos, 15); });
addEventListener('resize', () => renderChart(trackPoints));

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
