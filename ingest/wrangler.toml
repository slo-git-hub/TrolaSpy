# Public endpoint LeafSpy uploads to. Protected by the LEAFSPY_USER / LEAFSPY_PASS secrets.
name = "trolaspy-ingest"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "trolaspy"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Daily job: saves charging sessions; deletes readings older than RETENTION_DAYS ("0" = keep forever).
# Every 10 min: sends "Charging finished" when LeafSpy stops reporting a charge (car asleep).
[triggers]
crons = ["17 3 * * *", "*/10 * * * *"]

[vars]
RETENTION_DAYS = "0"
